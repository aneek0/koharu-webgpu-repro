<!doctype html>
<html>
<body style="font-family: monospace; background: #1e1e2e; color: #cdd6f4">
<pre id="out">checking navigator.gpu…</pre>
<script>
const out = document.getElementById('out');
(async () => {
  try {
    const adapter = await navigator.gpu.requestAdapter();
    const info = adapter ? await (adapter.requestAdapterInfo?.() ?? adapter.info) : null;
    out.textContent = 'requestAdapter() → ' + (adapter
      ? 'OK — ' + JSON.stringify({ vendor: info?.vendor, architecture: info?.architecture, featureLevel: info?.featureLevel ?? null })
      : 'null');
  } catch (e) {
    out.textContent = 'requestAdapter() threw: ' + e.message;
  }
})();
</script>
</body>
</html>
